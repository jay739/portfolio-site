# PR validation only — lint, test, and a production build to catch breakage
# BEFORE code reaches main. No image is built or pushed here; shipping the
# image is handled by build-and-deploy.yml on push to main.
name: CI (PR validation)

on:
  # No path filter: this is a REQUIRED status check on main, so it must run on
  # every PR. A path-skipped required check stays "Expected" forever and blocks merge.
  pull_request:
    branches:
      - main
      - dev

# Cancel superseded runs on the same PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes (Markdown, LICENSE, issue and discussion templates,
  # images and pages under docs/) skip the jobs below. They are skipped with a
  # job-level `if`, not paths-ignore, so required checks still pass.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # No usable base (manual run, new branch, rewritten history): build.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed"
          docs='^(.*\.md|LICENSE.*|\.github/(ISSUE_TEMPLATE|DISCUSSION_TEMPLATE)/.*|docs/.*\.(svg|png|jpe?g|gif|webp|ico|html|css))$'
          keep=''
          code_files=$( { echo "$changed" | grep -vE "$docs"; [ -n "$keep" ] && echo "$changed" | grep -E "$keep"; } | grep -c . || true)
          if [ "$code_files" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping the build and test jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6

      - name: ⬢ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: 📥 Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: 🔍 Lint
        run: npm run lint

      - name: 🧪 Test
        run: npm test --if-present

      - name: 🏗️ Production build
        env:
          # NEXT_PUBLIC_* is embedded in the client bundle, so it is not secret.
          # Pull from repo Variables if set; build still succeeds if empty.
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
